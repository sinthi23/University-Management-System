name: University Management System CI

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual test run' }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: university-management-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'University Management System/pom.xml'

      - name: Run all tests
        working-directory: "University Management System"
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: "University Management System/target/surefire-reports/"
          if-no-files-found: ignore
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | UniFlow</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand-mark">U</div>
    <p class="eyebrow">UNIFLOW CAMPUS</p><h1>Welcome back</h1>
    <p class="muted">Sign in to manage your university workspace.</p>
    <div class="alert" th:if="${param.error}">Invalid username or password.</div>
    <div class="success" th:if="${param.logout}">You have been signed out.</div>
    <form method="post" th:action="@{/login}">
        <label>Username<input name="username" required autofocus placeholder="e.g. admin"></label>
        <label>Password<input name="password" type="password" required placeholder="Your password"></label>
        <button class="primary full" type="submit">Sign in <span>→</span></button>
    </form>
    <p class="hint">Demo accounts: admin, teacher, student &middot; password</p>
</main>
</body>
</html>

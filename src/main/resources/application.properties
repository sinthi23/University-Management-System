spring.application.name=University Management System
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/university}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:university}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:university}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.error.include-message=always
